name: Build VK Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            files: '"app/VK Desktop linux x64.zip" "app/VK Desktop linux arm64.zip"'
          - os: windows-latest
            files: '"app/VK Desktop Setup x64.exe" "app/VK Desktop Setup x32.exe"'
          - os: macos-latest
            files: '"app/VK Desktop mac x64.dmg" "app/VK Desktop mac arm64.dmg"'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build Electron app
        run: yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create installer
        if: startsWith(matrix.os, 'windows')
        run: yarn win-setup

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: VK-Desktop-${{ runner.os }}
          path: |
            app/*.exe
            app/*.dmg
            app/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload binaries to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} ${{ matrix.files }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
