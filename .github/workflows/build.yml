name: Build VK Desktop

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            otherArch: arm64
            x64File: app/VK Desktop Linux x64.zip
            otherFile: app/VK Desktop Linux arm64.zip
          - os: windows-latest
            otherArch: x32
            x64File: app/VK Desktop Setup x64.exe
            otherFile: app/VK Desktop Setup x32.exe
          - os: macos-latest
            otherArch: arm64
            x64File: app/VK Desktop macOS x64.dmg
            otherFile: app/VK Desktop macOS arm64.dmg

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Build Electron app
        run: yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create installer
        if: startsWith(matrix.os, 'windows')
        run: yarn win-setup

      - name: Upload x64 artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.x64File }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload ${{ matrix.otherArch }} artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.otherFile }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload binaries to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} "${{ matrix.x64File }}" "${{ matrix.otherFile }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
